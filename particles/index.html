<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Collective — Neuro-Spatial Strategies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="tags" class="tags" aria-live="polite"></div>
    <div id="termPopup" class="term-popup" hidden>
      <p class="term-popup-title"></p>
      <p class="term-popup-body"></p>
    </div>

    <header class="chrome-top">
      <p class="presents">Space Collective presents:</p>
      <h1 class="title">Neuro-Spatial Strategies</h1>
      <p class="subtitle">Designing for the Mind and Body</p>
    </header>

    <aside class="controls" id="controls" aria-label="Particle controls">
      <button
        type="button"
        class="controls-toggle"
        id="controlsToggle"
        aria-expanded="true"
        aria-controls="controlsBody"
        title="Hide controls"
      >
        <span class="controls-toggle-arrow" aria-hidden="true"></span>
      </button>
      <div class="controls-body" id="controlsBody">
        <label>
          <span>Birth count</span>
          <input id="birth" type="range" min="1" max="200" value="40" />
          <output id="birthOut">40 /s</output>
        </label>
        <label>
          <span>Life duration</span>
          <input id="life" type="range" min="1" max="6" step="0.1" value="3" />
          <output id="lifeOut">3.0 s</output>
        </label>
        <label>
          <span>Speed</span>
          <input id="speed" type="range" min="0.05" max="0.6" step="0.01" value="0.08" />
          <output id="speedOut">0.08×</output>
        </label>
        <label>
          <span>Trail length</span>
          <input id="trail" type="range" min="2" max="120" value="48" />
          <output id="trailOut">48</output>
        </label>
        <label>
          <span>Path</span>
          <input id="path" type="range" min="0" max="1" step="0.01" value="0.18" />
          <output id="pathOut">slight</output>
        </label>
        <p class="path-hint">straight · random · fractal</p>
        <label class="toggle-row">
          <span>Tags</span>
          <input id="tagsToggle" type="checkbox" checked />
        </label>
      </div>
    </aside>

    <footer class="chrome-bottom">
      <a class="know-more" href="know-more.html">Know more</a>
      <div class="date-row">
        <div class="date-block">
          <span class="label">Date</span>
          <span class="value">4–5 December 2026</span>
        </div>
        <a
          class="atlas-mark-link"
          href="https://atlasuniversity.edu.in/schools/isdi/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="atlas-mark"
            src="atlas.png"
            alt="Atlas Skilltech University"
            width="56"
            height="56"
          />
        </a>
      </div>
    </footer>

    <script src="terms.js"></script>
    <script src="app.js"></script>
  </body>
</html>
